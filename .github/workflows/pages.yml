name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate results
        id: generate_results
        continue-on-error: true
        run: |
          python src/main.py
        env:
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}

      - name: Sync generated results
        if: steps.generate_results.outcome == 'success'
        run: |
          python scripts/sync_results.py --force

      - name: Use committed docs results when API generation fails
        if: steps.generate_results.outcome != 'success'
        run: |
          echo "Result generation failed; deploying committed docs/results assets instead."

      - name: Ensure docs exist
        run: |
          mkdir -p docs/results
          ls -la docs || true

      - name: Build site (no-op)
        run: echo "No static site build step required; using docs/ contents"

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
